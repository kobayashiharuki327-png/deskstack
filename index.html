<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>桜電設 見積・請求書管理</title><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet"><style id="app-style">
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --ink:#1B2430; --paper:#F2F5F3; --surface:#FFFFFF;
    --sakura:#B0446A;
    --sakura-fill:#A83D5E; --sakura-fill-dk:#7C2C44;
    --ground:#2F6647; --caution:#9C6A12; --progress:#2E5A79; --navy:#1B2430;
    --line:#DCE2DE; --muted:#667079; --danger:#B0382C;
    --font-display:'Shippori Mincho',serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#E9ECEC; --paper:#15191C; --surface:#1D2226;
      --sakura:#EBA0B6;
      --line:#2B3237; --muted:#96A0A6; --danger:#E07364;
    }
  }
  :root[data-theme="dark"]{
    --ink:#E9ECEC; --paper:#15191C; --surface:#1D2226;
    --sakura:#EBA0B6;
    --line:#2B3237; --muted:#96A0A6; --danger:#E07364;
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
  body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-body);margin:0;}
  input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  a{color:var(--sakura);}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--sakura); outline-offset:2px;
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .app-shell{min-height:100%;display:flex;}
  .sidebar{
    width:216px;flex:0 0 216px;background:var(--navy);color:#F2F5F3;
    position:sticky;top:0;align-self:flex-start;min-height:100vh;
    padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  }
  .brand{font-family:var(--font-display);font-size:21px;font-weight:700;color:#fff;padding:2px 10px 22px;letter-spacing:.02em;}
  .brand small{display:block;font-family:var(--font-body);font-size:11px;font-weight:400;color:#9CA6AC;margin-top:3px;letter-spacing:.04em;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;
    color:#C7CDD1;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;text-align:left;width:100%;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--sakura-fill);color:#fff;}
  .nav-icon{width:18px;text-align:center;font-size:15px;}
  .sidebar-foot{margin-top:auto;padding:10px 12px;font-size:11.5px;color:#7C868C;line-height:1.5;}

  .main{flex:1;min-width:0;padding:32px 40px 80px;max-width:1180px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .page-title{font-size:22px;font-weight:700;}
  .page-sub{color:var(--muted);font-size:13px;margin-top:4px;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:5px;border:1px solid transparent;
    background:var(--sakura-fill);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--sakura-fill-dk);}
  .btn.secondary{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500;}
  .btn.secondary:hover{border-color:var(--sakura);color:var(--sakura);}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);font-weight:500;}
  .btn.danger:hover{background:var(--danger);color:#fff;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn-icon{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:28px;height:28px;border-radius:4px;cursor:pointer;line-height:1;}
  .btn-icon:hover{color:var(--danger);border-color:var(--danger);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;}
  .banner{background:var(--surface);border:1px solid var(--caution);border-left:4px solid var(--caution);border-radius:6px;padding:12px 16px;margin-bottom:20px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;border-left:3px solid var(--line);}
  .stat-card[data-nav-href]{cursor:pointer;}
  .stat-card[data-nav-href]:hover{border-color:var(--sakura);}
  .stat-card .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-card .l{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .stat-card.accent{border-left-color:var(--sakura);}
  .stat-card.accent .n{color:var(--sakura);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .input, select.input, textarea.input{
    padding:9px 11px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);width:100%;
  }
  .search-input{max-width:260px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .list-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);}
  .list-table td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .list-table tbody tr{cursor:pointer;}
  .list-table tr:hover td{background:rgba(168,61,94,.05);}
  .list-table a.row-link{color:var(--ink);text-decoration:none;font-weight:500;}
  .list-table a.row-link:hover{color:var(--sakura);}
  .list-table td.truncate-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);}
  .empty-state .btn{margin-top:14px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
  .badge-見積中{background:var(--caution);}
  .badge-受注{background:var(--sakura-fill);}
  .badge-施工中{background:var(--progress);}
  .badge-請求済み{background:var(--navy);color:#fff;}
  .badge-入金済み{background:var(--ground);}
  .badge-請求前{background:var(--danger);}

  .editor-grid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:24px;align-items:start;}
  @media (max-width:980px){ .editor-grid{grid-template-columns:1fr;} }
  .editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}

  .item-table{margin:6px 0 4px;}
  .item-table th{font-size:11.5px;color:var(--muted);text-align:left;padding:0 6px 6px;font-weight:500;}
  .item-table td{padding:4px 6px;vertical-align:top;}
  .item-table input{padding:7px 8px;font-size:13px;}
  .item-table .col-qty input, .item-table .col-price input{text-align:right;}
  .item-table .col-name{width:auto;}
  .item-table .col-qty{width:64px;} .item-table .col-unit{width:64px;} .item-table .col-price{width:100px;} .item-table .col-del{width:30px;}
  .item-table tr[data-type="heading"] td{padding-top:10px;}
  .item-heading-name{font-weight:700;background:rgba(168,61,94,.07);}

  .paper-frame{position:sticky;top:20px;overflow:hidden;}
  .doc-pages{width:210mm;transform-origin:top left;display:flex;flex-direction:column;gap:14px;}
  .doc-page{background:#fff;color:#1B2430;border:1px solid var(--line);width:210mm;height:297mm;padding:15mm 15mm 14mm;font-family:var(--font-body);box-shadow:0 2px 10px rgba(0,0,0,.08);position:relative;overflow:hidden;}

  .form-sec{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .form-sec:first-of-type{margin-top:6px;}
  .tgl-row{display:flex;gap:8px;flex-wrap:wrap;}
  .tgl{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;background:var(--surface);}
  .tgl:has(input:checked){border-color:var(--sakura);color:var(--sakura);font-weight:700;}
  .tgl input{accent-color:var(--sakura-fill);margin:0;}
  .item-table .col-drag{width:22px;padding-left:0;padding-right:0;}
  .drag-handle{display:inline-block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:14px;letter-spacing:-3px;padding:7px 4px;line-height:1;}
  .drag-handle:hover{color:var(--sakura);}
  .item-row.dragging td{background:rgba(168,61,94,.10);}
  .item-row.dragging .drag-handle{cursor:grabbing;color:var(--sakura);}
  body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing;}
  .detail-section{margin-top:22px;}
  .detail-section h3{font-size:14.5px;margin-bottom:10px;color:var(--muted);font-weight:700;}
  .mini-list{border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .mini-list a{display:flex;justify-content:space-between;padding:11px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);font-size:13.5px;}
  .mini-list a:last-child{border-bottom:none;}
  .mini-list a:hover{background:rgba(168,61,94,.06);}
  .mini-list .mn{color:var(--muted);font-size:12px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:6px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .top-bar{display:none;}
  @media (max-width:840px){
    .app-shell{flex-direction:column;}
    /* スマホ：メニューを画面下に固定し、6つを横いっぱいに均等に並べる（スクロール不要） */
    .sidebar{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;flex:none;min-height:0;
      display:grid;grid-template-columns:repeat(6,1fr);gap:0;align-items:stretch;
      padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
      overflow:visible;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.15);
    }
    .brand,.sidebar-foot{display:none;}
    .nav-item{
      flex-direction:column;justify-content:center;align-items:center;gap:2px;
      width:auto;min-width:0;min-height:52px;padding:6px 2px;border-radius:8px;
      font-size:11px;line-height:1.2;text-align:center;white-space:nowrap;
    }
    .nav-icon{width:auto;font-size:18px;line-height:1;}
    .main{padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px));}
    .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px));}
    /* 一覧表：文字が1文字ずつ折り返さないようにして、はみ出た分は横にスクロール */
    [id^="doc-table-wrap"], #projects-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .list-table th, .list-table td{white-space:nowrap;}
    .list-table td.truncate-cell{max-width:140px;}
    .card{padding:14px;}
    /* 明細入力：1行目に品名、2行目に数量・単位・単価の2段組みにする */
    .item-table, .item-table tbody{display:block;width:100%;}
    .item-table thead{display:none;}
    .item-table tr.item-row{
      display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) 30px;
      grid-template-areas:"drag name name name del" "drag qty unit price del";
      column-gap:6px;row-gap:4px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line);
    }
    .item-table tr[data-type="heading"]{grid-template-areas:"drag name name name del";align-items:center;}
    .item-table td{display:block;padding:0 !important;width:auto !important;min-width:0;}
    .item-table td.col-drag{grid-area:drag;align-self:center;}
    .item-table td.col-name{grid-area:name;}
    .item-table td.col-qty{grid-area:qty;}
    .item-table td.col-unit{grid-area:unit;}
    .item-table td.col-price{grid-area:price;}
    .item-table td.col-del{grid-area:del;align-self:center;}
    .item-table td.col-qty::before{content:"数量";}
    .item-table td.col-unit::before{content:"単位";}
    .item-table td.col-price::before{content:"単価";}
    .item-table td.col-qty::before, .item-table td.col-unit::before, .item-table td.col-price::before{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;}
    .item-table input{width:100%;font-size:16px;}
    .template-picker{margin:8px 0 0 !important;display:block !important;width:100% !important;}
    .field-row{grid-template-columns:1fr;}
  }

  @media print{
    body *{visibility:hidden;}
    #print-target, #print-target *{visibility:visible;}
    #print-target{position:absolute;left:0;top:0;width:210mm;gap:0;transform:none !important;}
    #print-target .doc-page{border:none;box-shadow:none;break-after:page;page-break-after:always;}
    #print-target .doc-page:last-child{break-after:auto;page-break-after:auto;}
    .paper-frame{height:auto !important;overflow:visible;position:static;}
    @page{ size:A4; margin:0; }
  }

  function colSnap(q){

    var list = Object.keys(store).filter(function(k){ return k.indexOf(pre)===0 && k.slice(pre.length).indexOf("/")===-1; })
      .map(function(k){ return { id:k.slice(pre.length), _d:store[k] }; });
    if(q.field){ list.sort(function(a,b){ var x=a._d[q.field]||0, y=b._d[q.field]||0; return q.dir==="desc" ? (y>x?1:y<x?-1:0) : (x>y?1:x<y?-1:0); }); }

var lastFocusedRow = null;
document.addEventListener("focusin", function(e){
  var row = e.target.closest && e.target.closest(".item-row");
  if(row) lastFocusedRow = row;
});
function insertRowAfterFocus(tbody, html){
  var anchor = (lastFocusedRow && tbody.contains(lastFocusedRow)) ? lastFocusedRow : null;
  if(anchor){
    anchor.insertAdjacentHTML("afterend", html);
    lastFocusedRow = anchor.nextElementSibling;
  } else {
    tbody.insertAdjacentHTML("beforeend", html);
    lastFocusedRow = tbody.lastElementChild;
  }
  return lastFocusedRow;
}
function computeRoundingDiscount(subtotal){
  for(var d=0; d<200; d++){
    var ns = subtotal - d;

/* 1行に収めたい文字が折り返すときは、小さくなりすぎない範囲で自動縮小する */
function fitTexts(root){
  if(!root) return;
  qsa(".fit", root).forEach(function(el){
    el.style.fontSize=""; el.classList.remove("fit-wrap");
    if(el.scrollWidth <= el.clientWidth + 1) return;
    var base = parseFloat(getComputedStyle(el).fontSize) || 12;
    var min = Math.max(8, base*0.72), fs = base;
    while(fs > min && el.scrollWidth > el.clientWidth + 1){ fs = Math.max(min, fs - 0.5); el.style.fontSize = fs + "px"; }
    if(el.scrollWidth > el.clientWidth + 1){ el.classList.add("fit-wrap"); }
  });
}

/* 金額の枠の上端を、自社情報の一番下の行の下にそろえる（件名などもまとめて動く） */
function alignAmtBox(root){
  if(!root) return;
  var amt = qs(".d-amt", root), low = qs(".d-lowleft", root);
  if(!amt || !low) return;
  low.style.marginTop = "";
  var box = qs(".d-amt .d-box", root) || amt;
  var bank = qs(".d-bankr", root);
  var sc = (root.getBoundingClientRect().width / (root.offsetWidth||1)) || 1;
  for(var i=0;i<5;i++){
    var delta;
    if(bank){
      /* 請求書：金額の枠の下の線を、お振込先の枠の下の線にそろえる */
      delta = (bank.getBoundingClientRect().bottom - box.getBoundingClientRect().bottom) / sc;
    } else {
      /* 見積書：金額の枠の上の線を、自社情報の一番下の行の下にそろえる */
      var rows = qsa(".d-issuer > *", root);
      if(!rows.length) return;
      delta = (rows[rows.length-1].getBoundingClientRect().bottom - amt.getBoundingClientRect().top) / sc + 8;
    }
    if(Math.abs(delta) < 0.5) break;
    var base = parseFloat(getComputedStyle(low).marginTop) || 0;
    low.style.marginTop = Math.max(6, base + delta) + "px";
  }
}
/* 明細が1枚に収まらないときは、A4のページに分けて並べる */
function renderPages(target, parts){
  target.innerHTML = "";
  target.classList.add("measuring");
  var pages = [];
  function newPage(first){
    var pg = document.createElement("div");
    pg.className = "doc-page";
    pg.innerHTML = (first ? parts.head : parts.cont)
      + '<div class="d-items-wrap"><table class="d-items">'+parts.thead+'<tbody></tbody></table></div>';
    target.appendChild(pg);
    pages.push(pg);
    if(first){ fitTexts(pg); alignAmtBox(pg); }
    return pg;
  }
  function sc(){ return (target.getBoundingClientRect().width / (target.offsetWidth||1)) || 1; }
  function limitOf(pg){ /* 使える一番下（ページ番号の分をあける） */
    var cs = getComputedStyle(pg);
    return pg.clientHeight - parseFloat(cs.paddingBottom||0);
  }
  function usedOf(pg){
    var last = pg.lastElementChild;
    var r0 = pg.getBoundingClientRect();
    return (last.getBoundingClientRect().bottom - r0.top) / sc();
  }
  function bodyOf(pg){ return pg.querySelector(".d-items tbody"); }
  function addRow(pg, html){
    var tb = bodyOf(pg);
    tb.insertAdjacentHTML("beforeend", html);
    var tr = tb.lastElementChild;
    fitTexts(tr);
    return tr;
  }

  var pg = newPage(true);
  var i;
  for(i=0;i<parts.rows.length;i++){
    var tr = addRow(pg, parts.rows[i]);
    if(usedOf(pg) > limitOf(pg)){
      tr.parentNode.removeChild(tr);
      /* 見出し行や空行がページの最後に1行だけ残らないようにする */
      var tb = bodyOf(pg), lastTr = tb.lastElementChild, carry = [];
      if(lastTr && (lastTr.classList.contains("d-sec") || lastTr.classList.contains("d-gap")) && tb.children.length > 1){
        carry.push(lastTr.outerHTML); tb.removeChild(lastTr);
      }
      pg = newPage(false);
      carry.forEach(function(h){ addRow(pg, h); });
      if(parts.rows[i].indexOf('class="d-gap"') === -1) addRow(pg, parts.rows[i]);
    }
  }

  /* 内訳・備考をつけて、入らなければ次のページへ */
  pg.insertAdjacentHTML("beforeend", parts.tail);
  fitTexts(pg);
  if(usedOf(pg) > limitOf(pg)){
    qsa(":scope > .d-bottom, :scope > .d-notes", pg).forEach(function(el){ el.parentNode.removeChild(el); });
    pg = newPage(false);
    pg.insertAdjacentHTML("beforeend", parts.tail);
    fitTexts(pg);
  }
  /* 最後のページの空きを空行で埋める（備考欄は最低限の高さを残す） */
  var bottomBlock = pg.querySelector(":scope > .d-bottom");
  for(var g=0; g<60; g++){
    var tr2 = addRow(pg, parts.filler());
    if(usedOf(pg) > limitOf(pg)){ tr2.parentNode.removeChild(tr2); break; }
  }

  target.classList.remove("measuring");
  /* 途中のページは、表を少し伸ばしてページの下まできっちり埋める */
  pages.forEach(function(p, k){
    if(k === pages.length-1) return;
    var tbl = p.querySelector(".d-items");
    var rest = limitOf(p) - usedOf(p);
    if(tbl && rest > 0.5){ tbl.style.height = (tbl.getBoundingClientRect().height / sc() + rest) + "px"; }
  });
  var n = pages.length;
  pages.forEach(function(p, k){
    var f = document.createElement("div");
    f.className = "d-pageno";
    f.textContent = (n > 1 && parts.docNo ? parts.docNo + "　　" : "") + (k+1) + " / " + n;
    p.appendChild(f);
  });
}
function fitPaper(){
  var frame = qs(".paper-frame"), paper = qs("#print-target");
  if(!frame || !paper) return;
  paper.style.transform = "none";
  var natural = paper.offsetWidth || 794;
  var sc = Math.min(1, (frame.clientWidth || natural) / natural);
  paper.style.transform = sc < 1 ? "scale("+sc+")" : "none";
  frame.style.height = Math.ceil(paper.offsetHeight * sc) + "px";
  if(window.ResizeObserver && !frame._ro){
    frame._ro = new ResizeObserver(function(){ var w=frame.clientWidth; if(w!==frame._lw){ frame._lw=w; fitPaper(); } });
    frame._ro.observe(frame);
  }
}

/* ---------- 本物のPDFを作る(スマホ・PC共通) ---------- */
var PDF_BUSY = false;
var PDF_LIBS = null;
function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function loadPdfLibs(){
  if(!PDF_LIBS){
    PDF_LIBS = Promise.all([
      window.html2canvas ? null : loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
      (window.jspdf && window.jspdf.jsPDF) ? null : loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
    ]).catch(function(e){ PDF_LIBS = null; throw e; });
  }
  return PDF_LIBS;
}
function buildPdfBlob(target){
  var pages = Array.prototype.slice.call(target.querySelectorAll(".doc-page"));
  if(!pages.length) return Promise.reject(new Error("no pages"));
  var pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
  // 画面用の縮小(transform)を外した状態で、1ページずつA4実寸で撮る
  var opts = {
    scale: 3, backgroundColor: "#ffffff", useCORS: true, logging: false, windowWidth: 1280,
    onclone: function(doc){
      var t = doc.getElementById("print-target");
      if(t){ t.style.transform = "none"; t.style.gap = "0"; }
      var fr = doc.querySelector(".paper-frame");
      if(fr){ fr.style.overflow = "visible"; fr.style.height = "auto"; fr.style.position = "static"; }
      Array.prototype.forEach.call(doc.querySelectorAll("#print-target .doc-page"), function(p){
        p.style.border = "none"; p.style.boxShadow = "none";
      });
    }
  };
  var chain = Promise.resolve();
  pages.forEach(function(page, i){
    chain = chain.then(function(){ return window.html2canvas(page, opts); }).then(function(canvas){
      if(i > 0) pdf.addPage("a4", "portrait");
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
      canvas.width = canvas.height = 0;
    });
  });
  return chain.then(function(){ return pdf.output("blob"); });
}

/* ---------- バックアップ（非常用アプリ） ---------- */
function stripId(o){ var c = Object.assign({}, o); delete c.id; return c; }
function backupPayload(){
  var docs = {};
  docs["settings/company"] = Object.assign({}, STATE.settings || DEFAULT_SETTINGS);
  ["projects","customers","quotes","invoices"].forEach(function(col){
    (STATE[col]||[]).forEach(function(d){ if(d && d.id) docs[col+"/"+d.id] = stripId(d); });
  });
  return { format:"sakura-densetsu-backup", version:1, exportedAt:new Date().toISOString(), docs:docs };
}
function buildBackupHtml(payload){
  var css = (document.getElementById("app-style")||{}).textContent || "";
  var app = (document.getElementById("app-script")||{}).textContent || "";
  var json = payload ? JSON.stringify(payload).replace(/</g,"\\u003c") : "";
  var shim = "(" + offlineShim.toString() + ")();";
  return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
    + '<title>桜電設 見積・請求書管理'+(payload?'（非常用バックアップ）':'')+'</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">'
    + '<style id="app-style">' + css + '</style></head><body>'
    + SHELL_HTML + '<div class="toast" id="toast"></div>'
    + (payload ? '<script type="application/json" id="sakura-data">' + json + '</scr'+'ipt>' : '')
    + '<script>' + shim + '</scr'+'ipt>'
    + '<script id="app-script">' + app + '</scr'+'ipt>'
    + '</body></html>';
}
function saveFile(filename, blob){
  return claude.use("downloads").then(function(downloads){
    if(!downloads){ var e = new Error("unavailable"); e.code = "unavailable"; throw e; }
    return downloads.save({filename:filename, data:blob});
  });
}
function runBackup(btn){
  if(!STATE.ready){ toast("データの読み込み中です。少し待ってからもう一度押してください"); return; }
  if(btn) btn.disabled = true;
  var d = new Date(); var local = new Date(d.getTime()-d.getTimezoneOffset()*60000);
  var stamp = local.toISOString().slice(0,16).replace("T","_").replace(":","");
  var dataBlob, appBlob;
  try {
    dataBlob = new Blob([buildBackupHtml(backupPayload())], {type:"text/html"});
    appBlob = new Blob([buildBackupHtml(null)], {type:"text/html"});
  } catch(e){ if(btn) btn.disabled=false; toast("バックアップの作成に失敗しました"); return; }
  var dataSaved = false;
  /* 1つ目：データ入りのバックアップ（パソコンならダブルクリックで非常用アプリとしても開ける） */
  saveFile("桜電設_バックアップ_" + stamp + ".html", dataBlob).then(function(res){
    if(!(res && res.status)) return null;
    dataSaved = true;
    if(!window.SAKURA_OFFLINE && db){ db.doc("settings/company").update({lastBackupAt: Date.now()}).catch(function(){}); }
    toast("データを保存しました。続けてアプリ本体（GitHub用）を保存します");
    /* 2つ目：GitHubに置く用のアプリ本体（データは入っていない）。GitHub Pagesでは index.html という名前が必要 */
    return new Promise(function(r){ setTimeout(r, 600); }).then(function(){ return saveFile("index.html", appBlob); });
  }).then(function(res){
    if(btn) btn.disabled = false;
    if(res && res.status) toast("バックアップとアプリ本体（index.html）を保存しました");
  }).catch(function(err){
    if(btn) btn.disabled = false;
    if(err && err.code === "declined"){ if(dataSaved) toast("データは保存済みです（アプリ本体の保存はスキップしました）"); return; }
    if(err && err.code === "unavailable"){ toast("このビューではファイル保存を利用できません。"); return; }
    toast(dataSaved ? "データは保存済みです。アプリ本体の保存に失敗しました" : "バックアップの保存に失敗しました");
  });
}

/* 非常用アプリ用：Claudeの保存機能の代わりに、この端末のブラウザ内に保存する仕組み。
   ※この関数は単体で動くように書いてある（バックアップファイルにそのまま埋め込まれる） */
function offlineShim(){
  var dataEl = document.getElementById("sakura-data");
  var src = dataEl ? JSON.parse(dataEl.textContent) : null;
  var KEY = src ? "sakura-offline:" + src.exportedAt : "sakura-web:v1";
  var store = null, meta = null, canSave = true;
  try { var saved = localStorage.getItem(KEY); if(saved){ var o = JSON.parse(saved); store = o.docs; meta = o.meta || null; } } catch(e){ canSave = false; }
  if(!store) store = src ? JSON.parse(JSON.stringify(src.docs)) : {};
  if(!meta) meta = { exportedAt: src ? src.exportedAt : null };
  window.SAKURA_OFFLINE = { exportedAt: meta.exportedAt, site: !src };
  var listeners = [];
  function clone(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  function persist(){ if(!canSave) return; try { localStorage.setItem(KEY, JSON.stringify({docs:store, meta:meta})); } catch(e){ canSave = false; } }
  function newId(){ return "L" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function docSnap(path){ return { exists: Object.prototype.hasOwnProperty.call(store, path), id: path.split("/").pop(), data: function(){ return clone(store[path]); } }; }
  function colSnap(q){
    var pre = q.col + "/";
    var list = Object.keys(store).filter(function(k){ return k.indexOf(pre)===0 && k.slice(pre.length).indexOf("/")===-1; })
      .map(function(k){ return { id:k.slice(pre.length), _d:store[k] }; });
    if(q.field){ list.sort(function(a,b){ var x=a._d[q.field]||0, y=b._d[q.field]||0; return q.dir==="desc" ? (y>x?1:y<x?-1:0) : (x>y?1:x<y?-1:0); }); }
    if(q.lim) list = list.slice(0, q.lim);
    return { docs: list.map(function(it){ return { id: it.id, data: function(){ return clone(it._d); } }; }) };
  }
  function changed(){ persist(); setTimeout(function(){ listeners.slice().forEach(function(l){ try { l.cb(l.q ? colSnap(l.q) : docSnap(l.path)); } catch(e){} }); }, 0); }
  function listen(entry){ listeners.push(entry); setTimeout(function(){ entry.cb(entry.q ? colSnap(entry.q) : docSnap(entry.path)); }, 0); return function(){ var i = listeners.indexOf(entry); if(i>-1) listeners.splice(i,1); }; }
  function docRef(path){ return {
    id: path.split("/").pop(),
    get: function(){ return Promise.resolve(docSnap(path)); },
    set: function(d){ store[path] = clone(d); changed(); return Promise.resolve(); },
    update: function(d){ store[path] = Object.assign({}, store[path] || {}, clone(d)); changed(); return Promise.resolve(); },
    delete: function(){ delete store[path]; changed(); return Promise.resolve(); },
    onSnapshot: function(cb){ return listen({ path:path, cb:cb }); }
  }; }
  function query(q){ return {
    orderBy: function(f, dir){ return query(Object.assign({}, q, { field:f, dir:dir||"asc" })); },
    limit: function(n){ return query(Object.assign({}, q, { lim:n })); },
    get: function(){ return Promise.resolve(colSnap(q)); },
    onSnapshot: function(cb){ return listen({ q:q, cb:cb }); }
  }; }
  var db = {
    doc: function(path){ return docRef(path); },
    collection: function(col){ var base = query({ col:col }); base.add = function(d){ var id = newId(); store[col+"/"+id] = clone(d); changed(); return Promise.resolve(docRef(col+"/"+id)); }; base.doc = function(id){ return docRef(col+"/"+(id||newId())); }; return base; }
  };
  var downloads = { save: function(opt){
    var url = URL.createObjectURL(opt.data);
    var a = document.createElement("a"); a.href = url; a.download = opt.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    return Promise.resolve({ status:"saved" });
  } };
  window.claude = { use: function(name){ return Promise.resolve(name==="db" ? db : name==="downloads" ? downloads : null); } };
  function hasDocs(){ return Object.keys(store).some(function(k){ return /^(projects|quotes|invoices|customers)\//.test(k); }); }
  function parseBackup(text){
    text = String(text||"").trim();
    var obj;
    if(text.charAt(0) === "{") obj = JSON.parse(text);
    else {
      var m = text.match(/<script type="application\/json" id="sakura-data">([\s\S]*?)<\/script>/);
      if(!m) throw new Error("no data");
      obj = JSON.parse(m[1]);
    }
    if(!obj || obj.format !== "sakura-densetsu-backup" || !obj.docs) throw new Error("bad format");
    return obj;
  }
  function fmtStamp(iso){ if(!iso) return ""; var d = new Date(iso); return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); }
  var bar = null;
  function drawBar(){
    if(!bar) return;
    var msg;
    if(!hasDocs() && !meta.exportedAt) msg = "データがまだ入っていません。右のボタンからバックアップファイルを読み込んでください。";
    else msg = "Claudeなし版（" + fmtStamp(meta.exportedAt) + " 時点のバックアップ）。ここでの変更は、この端末のこのブラウザの中にだけ保存されます。";
    if(!canSave) msg += "※この環境では保存できないため、閉じると変更は消えます。";
    bar.innerHTML = "";
    var t = document.createElement("span"); t.textContent = msg; bar.appendChild(t);
    var lb = document.createElement("label");
    lb.textContent = "バックアップを読み込む";
    lb.style.cssText = "display:inline-block;margin-left:10px;padding:4px 12px;border-radius:999px;background:#fff;color:#7A520C;font-weight:700;cursor:pointer;white-space:nowrap;";
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".html,.htm,.json,text/html,application/json"; inp.style.display = "none";
    inp.addEventListener("change", function(){ if(inp.files && inp.files[0]) importFile(inp.files[0]); inp.value = ""; });
    lb.appendChild(inp); bar.appendChild(lb);
  }
  function importFile(file){
    var r = new FileReader();
    r.onload = function(){
      var obj;
      try { obj = parseBackup(r.result); }
      catch(e){ alert("バックアップファイルとして読み込めませんでした。「桜電設_バックアップ_〜.html」のファイルを選んでください。"); return; }
      if(hasDocs() && !confirm("今この端末に入っているデータを、" + fmtStamp(obj.exportedAt) + " 時点のバックアップで置き換えます。よろしいですか？")) return;
      store = JSON.parse(JSON.stringify(obj.docs));
      meta = { exportedAt: obj.exportedAt };
      window.SAKURA_OFFLINE.exportedAt = obj.exportedAt;
      changed(); drawBar();
      location.hash = "#/home";
      setTimeout(function(){ alert("読み込みました（" + fmtStamp(obj.exportedAt) + " 時点のデータ）"); }, 50);
    };
    r.onerror = function(){ alert("ファイルを読み込めませんでした"); };
    r.readAsText(file);
  }
  document.addEventListener("DOMContentLoaded", function(){
    bar = document.createElement("div");
    bar.style.cssText = "position:sticky;top:0;z-index:60;background:#9C6A12;color:#fff;font-size:12.5px;line-height:1.6;padding:8px 14px;text-align:center;";
    document.body.insertBefore(bar, document.body.firstChild);
    drawBar();
  });
}

    + '<h3 style="margin:18px 0 10px;font-size:14px;color:var(--muted);">請求書の振込先</h3>'
    + '<div class="field-row">'
      + '<div class="field"><label>金融機関名</label><input class="input" name="bankName" value="'+escAttr(s.bankName)+'"></div>'
      + '<div class="field"><label>支店名</label><input class="input" name="branchName" value="'+escAttr(s.branchName)+'"></div>'
    + '</div>'
    + '<div class="field-row">'
      + '<div class="field"><label>口座種別</label><select class="input" name="accountType"><option value="普通"'+(s.accountType==="普通"?" selected":"")+'>普通</option><option value="当座"'+(s.accountType==="当座"?" selected":"")+'>当座</option></select></div>'
      + '<div class="field"><label>口座番号</label><input class="input" name="accountNumber" value="'+escAttr(s.accountNumber)+'"></div>'
    + '</div>'
    + '<div class="field"><label>口座名義</label><input class="input" name="accountHolder" value="'+escAttr(s.accountHolder)+'"></div>'
    + '<div class="editor-actions"><button type="submit" class="btn">保存する</button></div>'
  + '</form>'
  + '<div class="card" style="margin-top:20px;">'
    + '<h3 style="margin:0 0 8px;font-size:15px;">バックアップ（非常用アプリ）</h3>'
    + '<div class="page-sub" style="margin:0 0 12px;line-height:1.7;">押すと2つのファイルを続けて保存します。<br>①「桜電設_バックアップ_日付.html」…今のデータ全部。パソコンならダブルクリックでそのまま非常用アプリとして開けます。iCloud Drive・Googleドライブ・USBなどにしまっておいてください。<br>②「index.html」…データの入っていない最新のアプリ本体。GitHubに上げておくと、iPhoneのSafariでも開けて、①を読み込めば同じように使えます。</div>'
    + '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;"><button type="button" class="btn" data-action="backup">今すぐバックアップ</button>'
    + '<span class="page-sub" style="margin:0;">最終バックアップ：'+(s.lastBackupAt ? fmtDate(new Date(s.lastBackupAt - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)) : 'まだありません')+'</span></div>'
  + '</div>';
}
function saveSettings(form){
  var data = {};
  ["companyName","repName","postalCode","phone","email","address","invoiceRegNumber","bankName","branchName","accountType","accountNumber","accountHolder"].forEach(function(f){
    data[f] = qs("[name="+f+"]",form).value.trim();
  });
  data.quoteValidDays = parseInt(qs("[name=quoteValidDays]",form).value,10)||30;
  data.invoiceDueDays = parseInt(qs("[name=invoiceDueDays]",form).value,10)||30;
  data.laborRate = parseInt(qs("[name=laborRate]",form).value,10)||0;
  db.doc("settings/company").update(data).then(function(){ toast("設定を保存しました"); });
}

/* ---------- helpers ---------- */
function escAttr(s){ return esc(s); }

/* ---------- event delegation ---------- */
document.addEventListener("click", function(e){
  var navBtn = e.target.closest("[data-nav]");
  if(navBtn){ go("#/"+navBtn.dataset.nav); return; }
  var navHref = e.target.closest("[data-nav-href]");
  if(navHref){ go(navHref.dataset.navHref); return; }
  var rowEl = e.target.closest("tr[data-href]");
  if(rowEl && !e.target.closest("a")){ go(rowEl.dataset.href); return; }

  var actionEl = e.target.closest("[data-action]");
  if(!actionEl) return;
  var action = actionEl.dataset.action;
  if(action==="add-item-row"){
    var body = actionEl.closest(".card").querySelector("tbody[id$='-items']");
    insertRowAfterFocus(body, itemRowHTML());
    var scope = actionEl.closest(".doc-editor");
    updatePreview(scope.dataset.kind, qs("form",scope));
  } else if(action==="add-heading-row"){
    var bodyH = actionEl.closest(".card").querySelector("tbody[id$='-items']");
    insertRowAfterFocus(bodyH, headingRowHTML());
    var scopeH = actionEl.closest(".doc-editor");
    updatePreview(scopeH.dataset.kind, qs("form",scopeH));
  } else if(action==="remove-item-row"){
    var row = actionEl.closest(".item-row");
    var scope2 = actionEl.closest(".doc-editor");
    row.remove();
    updatePreview(scope2.dataset.kind, qs("form",scope2));
  } else if(action==="delete-project"){ deleteProject(actionEl.dataset.id); }
  else if(action==="delete-quote"){ deleteCurrentDoc("quote", actionEl.dataset.id); }
  else if(action==="delete-invoice"){ deleteCurrentDoc("invoice", actionEl.dataset.id); }
  else if(action==="print-doc"){ printCurrentDoc(actionEl.dataset.kind); }
  else if(action==="backup"){ runBackup(actionEl); }
  else if(action==="delete-customer"){ deleteCustomer(actionEl); }
  else if(action==="save-as-customer"){
    var pf = actionEl.closest("form");
    var nm = qs("[name=customerName]",pf).value.trim();
    if(!nm){ toast("先に顧客名を入力してください"); return; }
    var dup = STATE.customers.filter(function(c){ return (c.name||"").trim()===nm; })[0];
    var info = qs("[name=contactInfo]",pf).value.trim();
    var cdata = { name:nm, honorific: qs("[name=honorific]",pf).value || (qs("[name=contactPerson]",pf).value.trim()?"御中":"様"),
      postalCode: qs("[name=postalCode]",pf).value.trim(), address: qs("[name=address]",pf).value.trim(),
      contactPerson: qs("[name=contactPerson]",pf).value.trim(), phone: info, email:"", memo:"" };
    if(dup){ delete cdata.email; delete cdata.memo; }
    saveDoc("customers", dup?dup.id:null, cdata).then(function(cid){
      qs("[name=customerId]",pf).value = cid;
      toast(dup ? "取引先「"+nm+"」の情報を更新しました" : "取引先「"+nm+"」を登録しました");
    });
  }
  else if(action==="mark-ordered"){
    var pid = actionEl.dataset.project;
    actionEl.disabled = true;
    saveDoc("projects", pid, {status:"受注"}).then(function(){
      toast("案件を「受注」にしました");
      if(actionEl.parentNode) actionEl.parentNode.removeChild(actionEl);
    }).catch(function(){ actionEl.disabled = false; toast("受注にできませんでした。もう一度押してください"); });
  }
});

document.addEventListener("input", function(e){
  var scope = e.target.closest(".doc-editor");
  if(scope){ updatePreview(scope.dataset.kind, qs("form",scope)); return; }
  if(e.target.id==="project-search" || e.target.id==="project-status-filter") filterProjects();
  if(e.target.id==="doc-search-quote") filterDocs("quote");
  if(e.target.id==="doc-search-invoice") filterDocs("invoice");
});

document.addEventListener("change", function(e){
  if(e.target.id==="quote-picker"){
    var qid = e.target.value;
    var form = e.target.closest("form");
    var q = findById(STATE.quotes, qid);
    if(q){
      var body = qs("#invoice-items", form);
      body.innerHTML = (q.items||[]).map(rowHTML).join("");
      updatePreview("invoice", form);
    }
  } else if(e.target.id==="customer-picker"){
    var cf = e.target.closest("form");
    var cc = findById(STATE.customers, e.target.value);
    if(cc){ applyCustomerToProjectForm(cf, cc); toast("「"+customerLabel(cc)+"」の情報を入れました"); }
    else if(cf){ qs("[name=customerId]",cf).value=""; }
  } else if(e.target.id==="project-picker"){
    var scope = e.target.closest(".doc-editor");
    if(scope) updatePreview(scope.dataset.kind, qs("form",scope));
  } else if(e.target.classList && e.target.classList.contains("template-picker")){
    var val = e.target.value;
    if(val){ insertTemplate(val, e.target.closest("form")); }
    e.target.value = "";
  }
});

document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  if(e.isComposing || e.keyCode === 229) return;
  var form = e.target.closest("#quote-form, #invoice-form, #project-form, #settings-form, #customer-form");
  if(!form || e.target.tagName === "TEXTAREA") return;
  e.preventDefault();
  var cls = e.target.classList;
  if(!cls) return;
  var row = e.target.closest(".item-row");
  if(cls.contains("item-name")){
    if(row) qs(".item-qty", row).focus();
  } else if(cls.contains("item-qty")){
    if(row) qs(".item-unit", row).focus();
  } else if(cls.contains("item-unit")){
    if(row) qs(".item-price", row).focus();
  } else if(cls.contains("item-price") || cls.contains("item-heading-name")){
    var body = e.target.closest("tbody");
    if(!body) return;
    var newRow = row ? (function(){ row.insertAdjacentHTML("afterend", itemRowHTML()); return row.nextElementSibling; })() : (function(){ body.insertAdjacentHTML("beforeend", itemRowHTML()); return body.lastElementChild; })();
    lastFocusedRow = newRow;
    var scope = form.closest(".doc-editor");
    if(scope) updatePreview(scope.dataset.kind, form);
    var nameField = qs(".item-name", newRow);
    if(nameField) nameField.focus();
  }
});

/* 明細の行・見出しをドラッグで並び替え（マウス・タッチ両対応） */
var dragState = null;
document.addEventListener("pointerdown", function(e){
  var h = e.target.closest(".drag-handle");
  if(!h) return;
  var row = h.closest(".item-row");
  if(!row) return;
  e.preventDefault();
  dragState = { row: row, body: row.parentNode };
  row.classList.add("dragging");
  document.body.classList.add("is-dragging");
  try{ h.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove", function(e){
  if(!dragState) return;
  e.preventDefault();
  var rows = qsa(".item-row", dragState.body).filter(function(r){ return r!==dragState.row; });
  var before = null;
  for(var i=0;i<rows.length;i++){
    var rc = rows[i].getBoundingClientRect();
    if(e.clientY < rc.top + rc.height/2){ before = rows[i]; break; }
  }
  if(before){ if(dragState.row.nextElementSibling!==before) dragState.body.insertBefore(dragState.row, before); }
  else if(dragState.body.lastElementChild!==dragState.row){ dragState.body.appendChild(dragState.row); }
  if(e.clientY < 70) window.scrollBy(0,-14);
  else if(e.clientY > window.innerHeight - 70) window.scrollBy(0,14);
}, {passive:false});
function endRowDrag(){
  if(!dragState) return;
  dragState.row.classList.remove("dragging");
  document.body.classList.remove("is-dragging");
  var scope = dragState.body.closest(".doc-editor");
  dragState = null;
  if(scope) updatePreview(scope.dataset.kind, qs("form",scope));
}
document.addEventListener("pointerup", endRowDrag);
document.addEventListener("pointercancel", endRowDrag);

document.addEventListener("submit", function(e){
  e.preventDefault();
  var form = e.target;
  if(form.id==="project-form") saveProject(form);
  else if(form.id==="customer-form") saveCustomer(form);
  else if(form.id==="quote-form") saveCurrentDoc("quote", form);
  else if(form.id==="invoice-form") saveCurrentDoc("invoice", form);
  else if(form.id==="settings-form") saveSettings(form);
});

initApp();
})();
</script></body></html>
